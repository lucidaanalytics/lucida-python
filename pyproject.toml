[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucida-analytics"
version = "0.1.1"
description = "Lucida server SDK: events, local feature-flag evaluation, historical import"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/lucidaanalytics/lucida-python"
Repository = "https://github.com/lucidaanalytics/lucida-python"
Issues = "https://github.com/lucidaanalytics/lucida-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/lucida"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# The OpenFeature provider uses `openfeature-sdk` when installed and stand-ins otherwise, which mypy cannot type both ways.
[[tool.mypy.overrides]]
module = "openfeature.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lucida.openfeature_provider"
ignore_errors = true
